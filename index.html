<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="curtain"></div>
  <div class="wrapper">
    <label class="theme-toggle" for="theme-switch" title="Cambiar tema claro/oscuro">
      <input type="checkbox" id="theme-switch" />
      <span class="toggle-track">
        <span class="toggle-icon toggle-icon-moon">🌙</span>
        <span class="toggle-icon toggle-icon-sun">☀️</span>
        <span class="toggle-thumb"></span>
      </span>
    </label>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">–</span>
        </div>

        <div class="panel-section hidden" id="challenge-hud">
          <span class="label">OBJETIVO</span>
          <span class="value objective" id="objective"></span>
          <span class="value timer" id="timer"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="highscore-entry" class="highscore-entry-form hidden">
          <p class="highscore-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <div class="highscore-entry-row">
            <input type="text" id="player-name" maxlength="12" placeholder="JUGADOR" autocomplete="off" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>
        <div class="highscores">
          <h3>Mejores puntuaciones</h3>
          <ol class="highscore-list" id="overlay-highscore-list"></ol>
        </div>
        <div class="overlay-actions">
          <button id="restart-btn">Reintentar</button>
          <button id="next-btn" class="hidden">Siguiente</button>
          <button id="menu-btn">Menú</button>
        </div>
      </div>
    </div>

    <div id="menu" class="menu hidden">
      <div class="menu-box">
        <h2>MODO DESAFÍO</h2>
        <div id="challenge-list" class="challenge-list"></div>
        <button id="classic-btn">Modo clásico</button>
        <div class="highscores">
          <h3>Mejores puntuaciones</h3>
          <ol class="highscore-list" id="menu-highscore-list"></ol>
          <button id="reset-scores-btn" class="reset-scores-btn">Resetear récords</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
